<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Awesome Mac · 精选 macOS 软件导航</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#e5e7eb; --text:#1f2328; --text-2:#57606a; --text-3:#8b949e;
    --accent:#0969da; --accent-soft:#eaf2fc; --red:#cf222e; --red-soft:#ffebe9;
    --green:#1a7f37; --green-soft:#e6f4ea; --purple:#8250df; --purple-soft:#f3eefc;
    --radius:10px; --shadow:0 1px 3px rgba(16,24,40,.07),0 1px 2px rgba(16,24,40,.04);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  a{color:inherit;text-decoration:none}
  button,select,input{font-family:inherit;font-size:13px}

  /* 顶栏 */
  header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:10px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;white-space:nowrap}
  .logo .apple{font-size:19px}
  .logo small{color:var(--text-3);font-weight:400;font-size:11.5px}
  .search-wrap{flex:1;min-width:220px;max-width:520px;position:relative}
  .search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--text-3);fill:none;stroke-width:2}
  #search{width:100%;padding:8px 32px 8px 34px;border:1px solid var(--border);border-radius:999px;outline:none;background:var(--bg);transition:.15s}
  #search:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(9,105,218,.1)}
  #search::placeholder{color:var(--text-3)}
  #clearBtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:var(--border);color:var(--text-2);width:18px;height:18px;border-radius:50%;cursor:pointer;font-size:11px;line-height:18px;display:none}
  .lang-switch{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--bg)}
  .lang-switch button{border:none;background:transparent;padding:5px 12px;cursor:pointer;color:var(--text-2);font-size:12.5px}
  .lang-switch button.on{background:var(--accent);color:#fff;font-weight:600}
  .built{color:var(--text-3);font-size:11.5px;white-space:nowrap}

  /* 控制栏 */
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 22px;background:var(--panel);border-bottom:1px solid var(--border)}
  .tabs{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:8px}
  .tab{border:none;background:transparent;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--text-2);font-size:13px;white-space:nowrap}
  .tab:hover{color:var(--text)}
  .tab.on{background:var(--panel);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.12)}
  .tab .n{font-size:11px;color:var(--text-3);margin-left:4px}
  .tab.on .n{color:var(--accent)}
  .selects{display:flex;gap:8px;align-items:center}
  select{
    appearance:none;-webkit-appearance:none;-moz-appearance:none;
    height:36px;padding:0 30px 0 13px;
    border:1px solid var(--border);border-radius:9px;
    background:var(--panel) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%238b949e' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 11px center;
    color:var(--text);cursor:pointer;outline:none;
    max-width:240px;text-overflow:ellipsis;white-space:nowrap;overflow:hidden;
    font-size:13px;transition:border-color .15s, box-shadow .15s;
  }
  select:hover{border-color:#b6bec7}
  select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(9,105,218,.12)}
  select:disabled{opacity:.45;cursor:not-allowed;background-color:var(--bg)}
  select:disabled:hover{border-color:var(--border)}
  .chips{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
  .chip{border:1px solid var(--border);background:var(--panel);color:var(--text-2);padding:8px 13px;line-height:1;border-radius:999px;cursor:pointer;font-size:12.5px;user-select:none;transition:.12s}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  /* 布局 */
  .layout{display:flex;align-items:flex-start;max-width:1500px;margin:0 auto}
  nav{position:sticky;top:0;width:236px;flex-shrink:0;height:calc(100vh - 0px);overflow-y:auto;padding:14px 10px 30px;background:var(--panel);border-right:1px solid var(--border)}
  nav::-webkit-scrollbar{width:6px}
  nav::-webkit-scrollbar-thumb{background:#d8dee4;border-radius:3px}
  .nav-title{font-size:11px;color:var(--text-3);letter-spacing:.05em;text-transform:uppercase;padding:8px 10px 6px}
  .nav-item{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 9px;border-radius:7px;cursor:pointer;color:var(--text-2);margin-bottom:1px;font-size:13px}
  .nav-item:hover{background:var(--bg);color:var(--text)}
  .nav-item.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .nav-item.sub{padding-left:20px;font-size:12.5px}
  .nav-item .c{font-size:10.5px;color:var(--text-3);background:var(--bg);padding:1px 6px;border-radius:999px}
  .nav-item.on .c{background:#dbeafe;color:var(--accent)}
  .nav-item .dot{width:5px;height:5px;border-radius:50%;background:var(--red);margin-left:5px;display:inline-block;vertical-align:middle}

  main{flex:1;min-width:0;padding:18px 22px 50px}

  /* 统计卡 */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;transition:.12s}
  .stat:hover{transform:translateY(-2px);border-color:#c9d1d9}
  .stat .num{font-size:22px;font-weight:700;line-height:1.2}
  .stat .lab{color:var(--text-2);font-size:11.5px;margin-top:2px}
  .stat.all .num{color:var(--accent)} .stat.cats .num{color:var(--green)}
  .stat.month .num{color:var(--purple)} .stat.today .num{color:var(--red)}

  /* 标题 */
  .head{display:flex;align-items:baseline;gap:10px;margin:2px 0 14px;flex-wrap:wrap}
  .head h2{font-size:17px}
  .head .sub{color:var(--text-3);font-size:12.5px}
  .head .reset{margin-left:auto;border:1px solid var(--border);background:var(--panel);color:var(--text-2);padding:4px 12px;border-radius:7px;cursor:pointer;font-size:12px;display:none}
  .head .reset:hover{border-color:var(--accent);color:var(--accent)}
  .head .reset.show{display:block}

  /* 内容 */
  .cat-block{margin-bottom:26px}
  .cat-title{font-size:14.5px;font-weight:700;padding-bottom:7px;border-bottom:1px solid var(--border);margin-bottom:11px;display:flex;align-items:center;gap:7px}
  .cat-title .en{font-size:11.5px;font-weight:400;color:var(--text-3)}
  .cat-title .n{font-size:11.5px;font-weight:400;color:var(--text-3);margin-left:auto}
  .sub-title{font-size:12.5px;color:var(--text-2);font-weight:600;margin:13px 0 7px;display:flex;gap:6px;align-items:baseline}
  .sub-title .en{font-weight:400;color:var(--text-3);font-size:11px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:9px}
  .card{display:block;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px;box-shadow:var(--shadow);transition:.14s;cursor:pointer;position:relative}
  .card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 3px 10px rgba(9,105,218,.1)}
  .card .name{font-weight:600;font-size:13.5px;color:var(--accent);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .card .name .zh{font-size:11px;color:var(--text-3);font-weight:400}
  .card .desc{color:var(--text-2);font-size:12.5px;line-height:1.55;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
  .card .meta{display:flex;gap:5px;align-items:center;margin-top:7px;flex-wrap:wrap}
  .badge{font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600;white-space:nowrap}
  .b-oss{background:var(--green-soft);color:var(--green)}
  .b-free{background:var(--accent-soft);color:var(--accent)}
  .b-appstore{background:#f0f3f8;color:var(--text-2)}
  .b-native{background:#fdf0e5;color:#bc4c00}
  .b-new{background:var(--red-soft);color:var(--red)}
  .card .path{font-size:10.5px;color:var(--text-3);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
  mark{background:#fff3a3;color:inherit;padding:0 1px;border-radius:2px}
  .empty{text-align:center;padding:70px 20px;color:var(--text-3)}
  .empty .big{font-size:38px;margin-bottom:10px}
  .empty button{margin-top:14px;border:1px solid var(--border);background:var(--panel);padding:6px 16px;border-radius:8px;cursor:pointer;color:var(--accent);font-size:13px}
  footer{text-align:center;color:var(--text-3);font-size:11.5px;padding:16px 0 26px}
  footer a{color:var(--accent)}
  @media(max-width:900px){nav{display:none}.built{display:none}}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="apple"></span><span>Awesome Mac</span><small id="snap"></small></div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search" type="text" autocomplete="off" data-i18n-ph="searchPh">
    <button id="clearBtn" title="clear">✕</button>
  </div>
  <div class="lang-switch">
    <button data-lang="zh" id="langZh">中文</button>
    <button data-lang="en" id="langEn">EN</button>
  </div>
  <div class="built" id="builtInfo"></div>
</header>

<div class="controls">
  <div class="tabs" id="tabs">
    <button class="tab" data-view="all"><span data-i18n="tAll">全部软件</span><span class="n"></span></button>
    <button class="tab" data-view="today"><span data-i18n="tToday">今日新增</span><span class="n"></span></button>
    <button class="tab" data-view="month"><span data-i18n="tMonth">本月新增</span><span class="n"></span></button>
  </div>
  <div class="selects">
    <select id="catSelect"></select>
    <select id="subSelect"></select>
  </div>
  <div class="chips" id="chips">
    <span class="chip" data-tag="oss" data-i18n="tagOss">开源</span>
    <span class="chip" data-tag="free" data-i18n="tagFree">免费</span>
    <span class="chip" data-tag="appstore" data-i18n="tagStore">App Store</span>
    <span class="chip" data-tag="native" data-i18n="tagNative">原生</span>
  </div>
</div>

<div class="layout">
  <nav id="sidebar"></nav>
  <main>
    <div class="stats" id="stats"></div>
    <div class="head">
      <h2 id="viewTitle"></h2>
      <span class="sub" id="viewSub"></span>
      <button class="reset" id="resetBtn" data-i18n="reset">重置筛选</button>
    </div>
    <div id="content"></div>
    <footer>
      <span data-i18n="footerSource">数据来源</span>：<a href="https://github.com/jaywcjlove/awesome-mac" target="_blank" rel="noopener">jaywcjlove/awesome-mac</a>
      · <span data-i18n="snapLabel">数据快照</span> <span id="snap2"></span>
    </footer>
  </main>
</div>

<script>
window.AWESOME_MAC_DATA = /*__DATA__*/;
</script>
<script>
(function () {
  'use strict';
  var DATA = window.AWESOME_MAC_DATA || {};
  var CATS = DATA.categories || [];
  var TODAY = DATA.today || '';
  var MONTH_START = DATA.monthStart || '';

  // ---------- i18n ----------
  var I18N = {
    zh: {
      searchPh: '搜索软件名称或描述，如：剪贴板、编辑器、OCR…',
      tAll: '全部软件', tToday: '今日新增', tMonth: '本月新增',
      tagOss: '开源', tagFree: '免费', tagStore: 'App Store', tagNative: '原生',
      allCats: '全部分类', allSubs: '全部子分类', subDisabled: '子分类（先选大类）',
      total: '收录软件', catCount: '软件分类', itemsUnit: '个', catUnit: '个分类', newMonth: '本月新增', newToday: '今日新增',
      reset: '重置筛选', items: '个', noDesc: '（暂无描述）', searchResult: '搜索结果',
      emptyTitle: '没有匹配的软件', emptySub: '换个关键词，或用更少的筛选条件试试',
      footerSource: '数据来源', snapLabel: '数据快照', built: '数据快照',
      newBadge: '新增', viewAll: '全部软件', viewToday: '今日新增', viewMonth: '本月新增',
      allSub: '全部子分类', count: '共 {n} 个', catPrefix: '分类', subPrefix: '子分类'
    },
    en: {
      searchPh: 'Search app name or description, e.g. clipboard, editor, OCR…',
      tAll: 'All Apps', tToday: 'Added Today', tMonth: 'Added This Month',
      tagOss: 'Open Source', tagFree: 'Free', tagStore: 'App Store', tagNative: 'Native',
      allCats: 'All Categories', allSubs: 'All Subcategories', subDisabled: 'Subcategory (pick a category first)',
      total: 'Total apps', catCount: 'Categories', itemsUnit: 'apps', catUnit: 'Categories', newMonth: 'New this month', newToday: 'New today',
      reset: 'Reset filters', items: '', noDesc: '(no description)', searchResult: 'Search results',
      emptyTitle: 'No apps found', emptySub: 'Try another keyword or fewer filters',
      footerSource: 'Data source', snapLabel: 'Snapshot', built: 'Snapshot',
      newBadge: 'new', viewAll: 'All Apps', viewToday: 'Added Today', viewMonth: 'Added This Month',
      allSub: 'All Subcategories', count: '{n} apps', catPrefix: 'Category', subPrefix: 'Subcategory'
    }
  };
  var LANG = localStorage.getItem('am-lang') || 'zh';

  function T(key) { return (I18N[LANG] && I18N[LANG][key]) || (I18N.zh[key] || key); }
  function L(obj, base) { // 取本地化字段: base + 'Zh'
    return LANG === 'zh' ? (obj[base + 'Zh'] || obj[base]) : obj[base];
  }
  function catName(cat) { return LANG === 'zh' ? (cat.zh || cat.name) : cat.name; }
  function catAltName(cat) { return LANG === 'zh' ? cat.name : (cat.zh || cat.name); }
  function subName(sub) { return LANG === 'zh' ? (sub.zh || sub.name) : sub.name; }
  function subAltName(sub) { return LANG === 'zh' ? sub.name : (sub.zh || sub.name); }

  // ---------- 数据展平 ----------
  var ITEMS = [];
  CATS.forEach(function (cat) {
    (cat.items || []).forEach(function (it) { it._cat = cat; it._sub = null; ITEMS.push(it); });
    (cat.subs || []).forEach(function (sub) {
      (sub.items || []).forEach(function (it) { it._cat = cat; it._sub = sub; ITEMS.push(it); });
    });
  });
  var TOTAL = ITEMS.length;
  var TODAY_ITEMS = ITEMS.filter(function (i) { return i.added === TODAY; });
  var MONTH_ITEMS = ITEMS.filter(function (i) { return i.added && i.added >= MONTH_START; });

  // ---------- 状态 ----------
  var state = { view: 'all', cat: null, sub: null, q: '', tags: {}, lang: LANG };

  var $ = function (s) { return document.querySelector(s); };
  var content = $('#content'), sidebar = $('#sidebar'), searchEl = $('#search'),
      catSelect = $('#catSelect'), subSelect = $('#subSelect'), clearBtn = $('#clearBtn');

  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };
  function hl(text, q) {
    var html = esc(text);
    if (!q) return html;
    q.split(/\s+/).filter(Boolean).forEach(function (term) {
      var re = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      html = html.replace(re, '<mark>$1</mark>');
    });
    return html;
  }

  // ---------- 筛选 ----------
  function baseList() {
    if (state.view === 'today') return TODAY_ITEMS;
    if (state.view === 'month') return MONTH_ITEMS;
    return ITEMS;
  }
  function filtered() {
    var q = state.q.trim().toLowerCase();
    var terms = q ? q.split(/\s+/) : [];
    // 搜索时全局检索, 不受视图/分类限制, 避免"搜不到/0 条"的困惑
    var scoped = !terms.length;
    var out = baseList().filter(function (it) {
      if (scoped && state.cat && it._cat.name !== state.cat) return false;
      if (scoped && state.sub && (!it._sub || it._sub.name !== state.sub)) return false;
      for (var t in state.tags) {
        if (state.tags[t] && (it.tags || []).indexOf(t) === -1) return false;
      }
      if (!terms.length) return true;
      var hay = [it.name, it.nameZh, it.desc, it.descZh,
                 it._cat.name, it._cat.zh, it._sub ? it._sub.name : '', it._sub ? it._sub.zh : '',
                 it.added || ''].join(' ').toLowerCase();
      return terms.every(function (t) { return hay.indexOf(t) !== -1; });
    });
    if (state.view !== 'all' && !terms.length) {
      out = out.slice().sort(function (a, b) {
        return (b.added || '').localeCompare(a.added || '') || a.name.localeCompare(b.name);
      });
    }
    return out;
  }

  var TAG_LABEL = { oss: 'tagOss', free: 'tagFree', appstore: 'tagStore', native: 'tagNative' };

  function card(it) {
    var name = L(it, 'name');
    var desc = L(it, 'desc');
    var badges = '';
    if (it.added) badges += '<span class="badge b-new">' + esc(T('newBadge')) + ' ' + it.added.slice(5) + '</span>';
    (it.tags || []).forEach(function (t) {
      if (TAG_LABEL[t]) badges += '<span class="badge b-' + t + '">' + esc(T(TAG_LABEL[t])) + '</span>';
    });
    var path = catName(it._cat) + (it._sub ? ' / ' + subName(it._sub) : '');
    return '<a class="card" href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
      '<div class="name">' + hl(name, state.q) +
        (LANG === 'zh' && it.nameZh && it.nameZh !== it.name ? '<span class="zh">' + hl(it.name, state.q) + '</span>' : '') +
      '</div>' +
      '<div class="desc">' + (desc ? hl(desc, state.q) : '<i style="color:var(--text-3)">' + esc(T('noDesc')) + '</i>') + '</div>' +
      '<div class="meta">' + badges + '<span class="path">' + esc(path) + '</span></div></a>';
  }

  function renderContent(items) {
    if (!items.length) {
      content.innerHTML = '<div class="empty"><div class="big">🔍</div><div>' + esc(T('emptyTitle')) + '</div>' +
        '<div style="font-size:12.5px;margin-top:6px">' + esc(T('emptySub')) + '</div>' +
        '<button id="emptyReset">' + esc(T('reset')) + '</button></div>';
      var b = $('#emptyReset');
      if (b) b.onclick = resetFilters;
      return;
    }
    var grouped = state.view === 'all' && !state.cat && !state.sub && !state.q;
    if (!grouped) {
      content.innerHTML = '<div class="grid">' + items.map(card).join('') + '</div>';
      return;
    }
    var html = '';
    CATS.forEach(function (cat) {
      var groups = [];
      if ((cat.items || []).length) groups.push({ sub: null, items: cat.items });
      (cat.subs || []).forEach(function (s) { if ((s.items || []).length) groups.push({ sub: s, items: s.items }); });
      if (!groups.length) return;
      var n = 0;
      groups.forEach(function (g) { n += g.items.length; });
      html += '<div class="cat-block"><div class="cat-title"><span>' + esc(catName(cat)) + '</span>' +
        '<span class="en">' + esc(catAltName(cat)) + '</span><span class="n">' + n + ' ' + esc(T('items')) + '</span></div>';
      groups.forEach(function (g) {
        if (g.sub) html += '<div class="sub-title"><span>' + esc(subName(g.sub)) + '</span><span class="en">' + esc(subAltName(g.sub)) + '</span></div>';
        html += '<div class="grid">' + g.items.map(card).join('') + '</div>';
      });
      html += '</div>';
    });
    content.innerHTML = html;
  }

  // ---------- 视图标题 ----------
  function viewTitle() {
    if (state.q.trim()) return T('searchResult') + '：' + state.q.trim();
    if (state.view === 'today') return T('viewToday');
    if (state.view === 'month') return T('viewMonth');
    if (state.cat) {
      var cat = CATS.find(function (c) { return c.name === state.cat; });
      var s = catName(cat);
      if (state.sub) {
        var sub = (cat.subs || []).find(function (x) { return x.name === state.sub; });
        if (sub) s += ' / ' + subName(sub);
      }
      return s;
    }
    return T('viewAll');
  }
  function viewSub(items) {
    var parts = [];
    if (state.view === 'today') parts.push(TODAY);
    else if (state.view === 'month') parts.push(MONTH_START + ' →');
    parts.push(T('count').replace('{n}', items.length));
    return parts.join(' · ');
  }

  // ---------- 侧栏 ----------
  function renderSidebar() {
    var html = '<div class="nav-title">' + esc(T('catPrefix')) + '</div>';
    CATS.forEach(function (cat) {
      var n = (cat.items || []).length + (cat.subs || []).reduce(function (a, s) { return a + (s.items || []).length; }, 0);
      var hasNew = (cat.items || []).some(function (i) { return i.added; }) ||
                   (cat.subs || []).some(function (s) { return (s.items || []).some(function (i) { return i.added; }); });
      html += '<div class="nav-item' + (state.cat === cat.name && !state.sub ? ' on' : '') + '" data-cat="' + esc(cat.name) + '">' +
        '<span>' + esc(catName(cat)) + (hasNew ? '<span class="dot"></span>' : '') + '</span><span class="c">' + n + '</span></div>';
      (cat.subs || []).forEach(function (sub) {
        if (!(sub.items || []).length) return;
        var on = state.cat === cat.name && state.sub === sub.name;
        html += '<div class="nav-item sub' + (on ? ' on' : '') + '" data-cat="' + esc(cat.name) + '" data-sub="' + esc(sub.name) + '">' +
          '<span>' + esc(subName(sub)) + '</span><span class="c">' + sub.items.length + '</span></div>';
      });
    });
    sidebar.innerHTML = html;
  }

  // ---------- 下拉选择器 ----------
  function renderSelects() {
    var html = '<option value="">' + esc(T('allCats')) + ' (' + TOTAL + ')</option>';
    CATS.forEach(function (cat) {
      var n = (cat.items || []).length + (cat.subs || []).reduce(function (a, s) { return a + (s.items || []).length; }, 0);
      html += '<option value="' + esc(cat.name) + '">' + esc(catName(cat)) + ' (' + n + ')</option>';
    });
    catSelect.innerHTML = html;
    catSelect.value = state.cat || '';

    var cat = CATS.find(function (c) { return c.name === state.cat; });
    if (!cat) {
      subSelect.innerHTML = '<option value="">' + esc(T('subDisabled')) + '</option>';
      subSelect.disabled = true;
      subSelect.value = '';
      return;
    }
    subSelect.disabled = false;
    var sh = '<option value="">' + esc(T('allSubs')) + '</option>';
    (cat.subs || []).forEach(function (s) {
      if (!(s.items || []).length) return;
      sh += '<option value="' + esc(s.name) + '">' + esc(subName(s)) + ' (' + s.items.length + ')</option>';
    });
    subSelect.innerHTML = sh;
    subSelect.value = state.sub || '';
  }

  function renderTabs() {
    document.querySelectorAll('.tab').forEach(function (t) {
      t.classList.toggle('on', t.dataset.view === state.view);
      var n = t.dataset.view === 'all' ? TOTAL : t.dataset.view === 'today' ? TODAY_ITEMS.length : MONTH_ITEMS.length;
      t.querySelector('.n').textContent = n;
    });
  }

  function renderStats() {
    $('#stats').innerHTML =
      '<div class="stat all" data-go="all"><div class="num">' + TOTAL + '</div><div class="lab">' + esc(T('total')) + '</div></div>' +
      '<div class="stat cats"><div class="num">' + CATS.length + '</div><div class="lab">' + esc(T('catCount')) + '</div></div>' +
      '<div class="stat month" data-go="month"><div class="num">' + MONTH_ITEMS.length + '</div><div class="lab">' + esc(T('newMonth')) + '</div></div>' +
      '<div class="stat today" data-go="today"><div class="num">' + TODAY_ITEMS.length + '</div><div class="lab">' + esc(T('newToday')) + '</div></div>';
    $('#stats').querySelectorAll('[data-go]').forEach(function (el) {
      el.onclick = function () { setView(el.dataset.go); };
    });
  }

  function renderChips() {
    document.querySelectorAll('.chip').forEach(function (c) {
      c.classList.toggle('on', !!state.tags[c.dataset.tag]);
    });
  }

  function render() {
    var items = filtered();
    $('#viewTitle').textContent = viewTitle();
    $('#viewSub').textContent = viewSub(items);
    $('#resetBtn').classList.toggle('show', !!(state.cat || state.sub || state.q || Object.keys(state.tags).some(function (k) { return state.tags[k]; }) || state.view !== 'all'));
    renderContent(items);
    renderSidebar();
    renderSelects();
    renderTabs();
    renderChips();
    renderStats();
    // 原生 select 的选项文本随语言变化, 需要重建(上面 renderSelects 已重建)
  }

  // ---------- 操作 ----------
  function clearSearch() {
    state.q = '';
    searchEl.value = '';
    clearBtn.style.display = 'none';
  }
  function setView(v) {
    state.view = v;
    state.cat = null; state.sub = null;   // 切换视图时清空分类, 保证看到完整的新增列表
    clearSearch();                        // 切视图也退出搜索模式, 避免"点了标签还是搜索结果"
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function setCat(cat, sub) {
    state.cat = cat || null;
    state.sub = sub || null;
    clearSearch();
    if (state.view !== 'all' && state.view !== 'today' && state.view !== 'month') state.view = 'all';
    render();
  }
  function resetFilters() {
    state.view = 'all'; state.cat = null; state.sub = null; state.q = ''; state.tags = {};
    searchEl.value = ''; clearBtn.style.display = 'none';
    render();
  }

  // ---------- 事件 ----------
  sidebar.addEventListener('click', function (e) {
    var el = e.target.closest('.nav-item');
    if (!el) return;
    setCat(el.dataset.cat, el.dataset.sub || null);
  });

  catSelect.addEventListener('change', function () {
    state.cat = catSelect.value || null;
    state.sub = null;
    render();
  });
  subSelect.addEventListener('change', function () {
    state.sub = subSelect.value || null;
    render();
  });

  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () { setView(t.dataset.view); });
  });

  $('#chips').addEventListener('click', function (e) {
    var el = e.target.closest('.chip');
    if (!el) return;
    var t = el.dataset.tag;
    state.tags[t] = !state.tags[t];
    render();
  });

  $('#resetBtn').addEventListener('click', resetFilters);

  var timer;
  searchEl.addEventListener('input', function () {
    clearBtn.style.display = searchEl.value ? 'block' : 'none';
    clearTimeout(timer);
    timer = setTimeout(function () {
      state.q = searchEl.value;
      if (state.q.trim()) { state.cat = null; state.sub = null; }
      render();
    }, 120);
  });
  clearBtn.addEventListener('click', function () {
    searchEl.value = ''; state.q = ''; clearBtn.style.display = 'none'; render(); searchEl.focus();
  });
  searchEl.addEventListener('keydown', function (e) { if (e.key === 'Escape') clearBtn.click(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== searchEl) { e.preventDefault(); searchEl.focus(); }
  });

  // ---------- 语言 ----------
  function applyLang() {
    document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
    document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = T(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-ph]').forEach(function (el) { el.placeholder = T(el.dataset.i18nPh); });
    $('#langZh').classList.toggle('on', LANG === 'zh');
    $('#langEn').classList.toggle('on', LANG === 'en');
    $('#snap').textContent = '· ' + T('snapLabel') + ' ' + TODAY;
    $('#snap2').textContent = TODAY;
    $('#builtInfo').textContent = TOTAL + ' ' + T('itemsUnit') + ' · ' + CATS.length + ' ' + T('catUnit');
    render();
  }
  function setLang(l) {
    LANG = l; state.lang = l;
    localStorage.setItem('am-lang', l);
    applyLang();
  }
  $('#langZh').addEventListener('click', function () { setLang('zh'); });
  $('#langEn').addEventListener('click', function () { setLang('en'); });

  // ---------- 启动 ----------
  if (!CATS.length || !TOTAL) {
    document.body.insertAdjacentHTML('afterbegin',
      '<div style="background:#ffebe9;color:#cf222e;padding:12px 20px;font-size:13px">数据未加载：请运行 python3 build.py 重新生成 index.html</div>');
  }
  applyLang();
})();
</script>
</body>
</html>
